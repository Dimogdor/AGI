name: Déployer le jeu sur GitHub Pages

# Construit le bundle obfusqué (www/), joue la suite de non-régression, puis publie sur
# GitHub Pages. Déclencheurs : push sur main (build + tests + déploiement), PR vers main
# (build + tests de vérification, sans déploiement), et bouton manuel.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# moindre privilège : build et tests (qui exécutent npm + Playwright, y compris sur les PR)
# n'ont que la lecture ; seules les permissions de publication vont au job « deploy »
permissions:
  contents: read

# une seule publication à la fois ; on n'annule pas un déploiement en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # seuls terser + javascript-obfuscator sont requis ; on saute les deps lourdes (electron…)
      - run: npm ci --no-audit --no-fund --omit=optional
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  # SUITE DE NON-RÉGRESSION (tools/regression.mjs) dans un vrai Chromium : 9 langues, tutoriel,
  # parties complètes, cataclysmes, rendu à chaque état du monde… Un échec bloque le déploiement.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund --omit=optional
      # syntaxe des scripts Node hors navigateur (l'appli PC Electron ne démarrait plus depuis le #40
      # à cause d'une apostrophe dans une chaîne — rien ne le vérifiait)
      - run: for f in electron/*.js build.mjs tools/*.mjs cloudflare-turn-worker.js; do node --check "$f"; done
      - run: npx playwright-core install --with-deps chromium
      - run: npm run dev
      - run: npm test

  deploy:
    needs: [build, test]
    # GitHub Pages n'autorise le déploiement que depuis main : sur une branche de
    # travail on se contente du build (vérification), sans tenter — et échouer — le déploiement.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true        # active Pages automatiquement au 1er run
      - id: deployment
        uses: actions/deploy-pages@v4
